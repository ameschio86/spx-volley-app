<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modulo — SPX Volley</title>
<meta name="description" content="Visualizza e scarica un modulo SPX Volley.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg class="geo-lines" viewBox="0 0 160 160" fill="none">
  <circle cx="170" cy="-10" r="60" stroke="#FFC72C" stroke-width="1"/>
  <line x1="90" y1="0" x2="160" y2="70" stroke="#FFC72C" stroke-width="1"/>
  <line x1="120" y1="0" x2="160" y2="40" stroke="#FFC72C" stroke-width="1"/>
</svg>

<div class="page">
  <div class="topbar">
    <a class="back" href="moduli.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6L9 12L15 18" stroke="#FFC72C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <div class="title">MODULI</div>
  </div>

  <div class="headline" id="doc-headline">Documento</div>
  <div class="sub">Anteprima della prima pagina</div>
  <div class="divider"></div>

  <div class="pdf-preview">
    <img id="pdf-thumb" alt="Anteprima del documento">
  </div>

  <a class="cta-btn" id="download-link" download>SCARICA PDF</a>

  <div class="foot">Dubbi? <a href="mailto:spxvolley@gmail.com">spxvolley@gmail.com</a></div>
</div>

<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const label = params.get('label') || 'Documento';

  if (file) {
    document.getElementById('doc-headline').textContent = label;
    document.getElementById('pdf-thumb').src = 'assets/moduli/thumbs/' + file.replace('.pdf', '.png');

    const src = 'assets/moduli/' + file;
    const downloadLink = document.getElementById('download-link');
    downloadLink.href = src;
    downloadLink.download = file;

    // Scarica il PDF come blob e lo salva da un blob-URL invece di navigare
    // al file direttamente: su Safari/iOS un link diretto al PDF apre sempre
    // l'anteprima a schermo intero, anche con l'attributo download. Passare
    // da un blob forza il download reale sul dispositivo.
    downloadLink.addEventListener('click', (event) => {
      event.preventDefault();
      const originalLabel = downloadLink.textContent;
      downloadLink.textContent = 'PREPARO IL FILE…';

      fetch(src)
        .then((response) => response.blob())
        .then((blob) => {
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = file;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
          downloadLink.textContent = originalLabel;
        })
        .catch(() => {
          // fallback: se il fetch fallisce (es. offline), naviga al file
          downloadLink.textContent = originalLabel;
          window.location.href = src;
        });
    });
  }
</script>
</body>
</html>
